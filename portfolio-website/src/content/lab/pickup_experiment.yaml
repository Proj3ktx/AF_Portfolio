mobile_pickup_experiment:
  ros__parameters:
    use_sim_time: true
    waypoints_flat: [0.0, 0.0, 0.9, 0.25, 1.8, 0.35, 0.9, 0.25, 0.0, 0.0]
    max_linear_speed: 0.16
    max_linear_accel: 0.12
    max_angular_speed: 0.7
    position_tolerance: 0.004
    return_position_tolerance: 0.01
    obstacle_stop_distance: 0.33
    camera_sample_period: 1.0
    max_duration_sec: 180.0
